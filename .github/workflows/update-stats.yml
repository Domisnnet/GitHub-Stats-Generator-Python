name: Atualizar GitHub Stats Automaticamente
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests matplotlib numpy python-dotenv
      - name: Rodar o Gerador de Stats
        env:
          PERSONAL_GH_TOKEN: ${{ secrets.PERSONAL_GH_TOKEN }}
        run: python generate_stats.py
      - name: Commitar e Pushar alterações
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/stats.json output/github-stats.png
          if git diff --staged --quiet; then
            echo "Nenhuma alteração nova."
          else
            git commit -m "chore: atualizar stats automaticamente"
            git push
          fi